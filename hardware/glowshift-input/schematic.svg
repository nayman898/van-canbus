<text x="1025" y="775" class="head" text-anchor="start">SHARED POWER AND UNUSED AMPLIFIER</text>
<text x="1025" y="808" class="small" text-anchor="start">J2.1 = Nucleo 3V3; J2.2 = GND</text>
<text x="1025" y="841" class="small" text-anchor="start">U1: pin 4 = 3V3; pin 11 = GND</text>
<text x="1025" y="874" class="small" text-anchor="start">C7 100nF + C8 1µF: across pins 4 / 11</text>
<text x="1025" y="907" class="small" text-anchor="start">R10 1k: 3V3 → GND (3.3mA bleeder)</text>
<text x="1025" y="940" class="small" text-anchor="start">Unused: pin 12 → GND; pin 13 → pin 14</text>
<text x="40" y="1017" class="small" text-anchor="start">J1.4 = confirmed common sender reference. *Verify A4 routes to PB11, with no I²C drive on that connection.</text>
<text x="40" y="1055" class="head note" text-anchor="start">POWER ON NUCLEO BEFORE CONNECTING J1. DISCONNECT J1 BEFORE REMOVING NUCLEO POWER.</text>
<text x="40" y="1086" class="small note" text-anchor="start">Untested supervised prototype. No guaranteed powered-off isolation. Read docs/glowshift-circuit.md before assembly.</text>
<text x="40" y="1114" class="small note" text-anchor="start">No sender supply wire, vehicle 12V or ignition-coil connection goes to this board.</text>
