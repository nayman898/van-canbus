<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
<title id="title">GlowShift three-channel analog input, prototype rev A</title>
<desc id="desc">Repeat a 100k/150k divider, 100nF input filter and two 1N4448 rail clamps three times. Each divider feeds one MCP6004 voltage follower powered by MCU 3.3 volts. A 1k resistor and 100nF capacitor feed the MCU analog input. All chip pin assignments and connector numbers are in the table. Disconnect gauge input taps before removing board power.</desc>
<style>text{font:19px DejaVu Sans,Arial,sans-serif;fill:#173347}.title{font-size:26px;font-weight:bold}.head{font-size:23px;font-weight:bold}.small{font-size:16px}.label{font-weight:bold;fill:#27687b}.note{fill:#884116}.wire{stroke:#27687b;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.part{stroke:#173347;stroke-width:2.5;fill:white}</style><rect width="1600" height="1130" fill="white"/>
