version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /android-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android:
        patterns: ['*']
