name: Verify, build, and publish wiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Host tools and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host and check dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Check Python for likely bugs
        run: python -m ruff check --select E9,F63,F7,F82 tools tests
      - name: Check dashboard JavaScript syntax
        run: node --check tools/dashboard/app.js
      - name: Check independent temperature displays
        run: |
          node tests/test_dashboard.js
          node tests/test_logger_web.js
      - name: Check ESP32 ignition sequencing, log encoding and download names
        run: |
          mkdir -p .cache/ci
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_logger_format.cpp -o .cache/ci/test_logger_format
          .cache/ci/test_logger_format
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_logger_live.cpp -o .cache/ci/test_logger_live
          .cache/ci/test_logger_live
      - name: Run host and documentation tests
        run: python -m unittest discover -s tests -v
      - name: Validate workflow syntax and expressions
        run: bash tools/ci/check-workflows.sh
      - name: Validate links and generate wiki preview
        run: python tools/export_wiki.py --output .cache/wiki-preview
      - name: Upload generated wiki for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-preview-${{ github.sha }}
          path: .cache/wiki-preview/*.md
          if-no-files-found: error
          retention-days: 14

  esp32-logger:
    name: ESP32 CAN logger firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.4.1'
      - name: Install pinned Espressif core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.6 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Build classic ESP32 logger
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
            --output-dir .cache/esp32-logger esp32-logger/van_can_logger
          cd .cache/esp32-logger
          sha256sum -- *.bin *.elf > SHA256SUMS
      - name: Upload logger firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-logger-${{ github.sha }}
          path: .cache/esp32-logger/
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: Firmware (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only required STM32 dependencies
        run: |
          git submodule update --init --depth 1 third_party/STM32CubeG0
          git -C third_party/STM32CubeG0 submodule update --init --depth 1 \
            Drivers/STM32G0xx_HAL_Driver Drivers/CMSIS/Device/ST/STM32G0xx
      - name: Install Arm compiler and CMake tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version
      - name: Check CAN encoding on the host
        run: |
          mkdir -p .cache/ci
          cc -std=c11 -Wall -Wextra -Werror -I Inc \
            Src/can_protocol.c tests/test_can_protocol.c -o .cache/ci/test_can_protocol
          .cache/ci/test_can_protocol
      - name: Build firmware and report memory use
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET" --parallel 2
          arm-none-eabi-size "build/$PRESET/van-canbus.elf"
          cd "build/$PRESET"
          sha256sum van-canbus.elf van-canbus.hex van-canbus.bin van-canbus.map > SHA256SUMS
      - name: Upload firmware images and memory map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.preset }}-${{ github.sha }}
          path: |
            build/${{ matrix.preset }}/van-canbus.elf
            build/${{ matrix.preset }}/van-canbus.hex
            build/${{ matrix.preset }}/van-canbus.bin
            build/${{ matrix.preset }}/van-canbus.map
            build/${{ matrix.preset }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android checks and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper and cache dependencies
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Hosted runners may have an SDK without sdkmanager on PATH.
      # Initialize it explicitly for all runs, including Dependabot PRs.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
      - name: Install the project's Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check Android CAN decoding
        run: |
          mkdir -p .cache/java-tests
          javac -d .cache/java-tests \
            android-app/app/src/main/java/com/nayman/vancan/protocol/CanFrame.java \
            android-app/app/src/main/java/com/nayman/vancan/protocol/VanCanDecoder.java \
            tests/java/VanCanDecoderTest.java
          java -cp .cache/java-tests VanCanDecoderTest
      - name: Restore optional consistent debug signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'No persistent debug key configured; APKs from different runs may require uninstalling the previous app.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Lint, run Gradle tests, and build the debug APK
        working-directory: android-app
        run: bash gradlew --no-daemon --console=plain :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Checksum APK
        working-directory: android-app/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > SHA256SUMS
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint and test reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.sha }}
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  wiki:
    name: Publish generated wiki
    needs: [checks, firmware, android, esp32-logger]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'nayman898/van-canbus'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Publish only generated pages when they change
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          GIT_ASKPASS: ${{ github.workspace }}/tools/ci/wiki-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
        run: |
          chmod +x tools/ci/wiki-askpass.sh
          python tools/publish_wiki.py --source-sha "$GITHUB_SHA"
